name: ACM Paper Summarizer

on:
  schedule:
    - cron: '0 0 * * *' # 毎日午前9時(JST)に実行
  workflow_dispatch:

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget google-chrome-stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install DrissionPage beautifulsoup4 google-genai requests pypdf

      - name: Run Paper Summarizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python acm_slack_notifier.py

      - name: Commit and push updated history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_papers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update processed papers history" && git push)
